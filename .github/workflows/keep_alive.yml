name: Keep-Alive Supabase

on:
  schedule:
    # Ejecutar cada 3 días a las 14:00 UTC (8:00 AM hora Ciudad de México)
    - cron: '0 14 */3 * *'
  workflow_dispatch: # Permite disparo manual desde la interfaz de GitHub Actions

jobs:
  ping-supabase:
    name: Ping Actividad Supabase
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install supabase python-dotenv

      - name: Ejecutar ciclo keep-alive
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python keep_alive_supabase.py
